monitor.access.configure:
  zh-CN: 配置免密读取…
  en: Set up passwordless reads…
monitor.access.title:
  zh-CN: 为“%{host}”配置读取权限
  en: Set up read access for “%{host}”
monitor.access.description:
  zh-CN: 将为当前 SSH 用户创建或更新 /etc/sudoers.d/shellrs-monitor-<UID>，仅允许免密读取 RGA 的 load、hardware，NPU 的 load、driver_version、version 节点，MPP 的 clk_summary 时钟节点，以及 Jetson 六个媒体引擎的固定 ACTMON usage 节点。需要远端管理员权限，配置成功后自动启用采集。
  en: Creates or updates /etc/sudoers.d/shellrs-monitor-<UID> for the current SSH user, allowing passwordless reads of only RGA load and hardware, NPU load, driver_version and version, MPP clk_summary, and fixed ACTMON usage nodes for six Jetson media engines. Requires remote administrator permission. Collection is enabled after setup succeeds.
monitor.access.password:
  zh-CN: 远端 sudo 密码
  en: Remote sudo password
monitor.access.password_hint:
  zh-CN: 仅用于本次授权，不保存。root 或已具备免密管理权限时可留空。
  en: Used only for this setup and never saved. Leave empty for root or existing passwordless administrator access.
monitor.access.install:
  zh-CN: 授权并配置
  en: Authorize and configure
monitor.access.working:
  zh-CN: 正在配置…
  en: Configuring…
monitor.access.changed:
  zh-CN: 连接已断开或重新建立，请关闭此窗口后重试
  en: The connection closed or reconnected. Close this dialog and try again.
monitor.access.failed:
  zh-CN: 配置未确认成功。请检查 sudo 密码、管理员权限及 visudo 是否可用；也可能是策略校验失败或连接中断。可重试配置。
  en: Setup was not confirmed. Check the sudo password, administrator permission and visudo availability. Policy validation or the connection may also have failed. You can retry setup.
monitor.access.ready:
  zh-CN: 已配置读取权限，正在重新探测硬件
  en: Read access configured. Probing hardware again.
monitor.access.completed_elsewhere:
  zh-CN: 原主机的读取权限已配置。当前连接已改变，请切回原主机并启用 sudo 读取。
  en: Read access was configured on the original host. The active connection changed; return to that host and enable sudo reads.

